# DDyu 个人站 · Nginx 反代示例
#
# 何时需要本文件：
#   - 用 Cloudflare Tunnel 时不需要（tunnel 直连 127.0.0.1:8000，见 deploy/cloudflared/config.yml）；
#   - 若改为「Nginx 直接对外 + Let's Encrypt」则用本文件。
#
# 关键点（踩过的坑）：
#   /v1/responses、/v1/chat/completions 是 SSE 流式响应，**必须 proxy_buffering off**，
#   否则前端会一直转圈到最后一次性出字（等于流式失效）。媒体上传/下载需要放宽体积与超时。

upstream ddyu_site {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ddyu.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ddyu.online;

    ssl_certificate     /etc/letsencrypt/live/ddyu.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddyu.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 视频（最大 256 MiB）与图片上传，留出余量
    client_max_body_size 300m;
    client_body_timeout 300s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://ddyu_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ⚠️ 必须与 config.yaml 的 server.trustedProxies 对齐，否则客户端 IP 可被伪造
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ✅ SSE：关闭缓冲与缓存，否则流式对话失效
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # 媒体读取会带上短签名查询串，缓存由后端用 Cache-Control 控制，这里不额外缓存
    location /v1/media/ {
        proxy_pass http://ddyu_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
